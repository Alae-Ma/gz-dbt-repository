# schema.yml

version: 2

sources:
  - name: raw
    schema: gz_raw_data
    tables:
      - name: sales
        identifier: raw_gz_sales
        description: sales of Greenweez / date_date, orders_id, products_id, revenue, quantity
        # Freshness testing - make sure to fill in the...
        loaded_at_field: CAST(date_date AS TIMESTAMP)
        freshness:
           warn_after: {count: 90, period: day}      
        columns:
         - name : date_date
         - name : orders_id
           tests : 
            - not_null
         - name : products_id
         - name : revenue
         - name : quantity
      - name: product
        identifier: raw_gz_product
        description: Product reference table / contains product_id and purchase_price
        columns:
        - name : products_id
          description : Key to test
          tests :
           - unique
           - not_null
        - name : purchase_price
      - name: ship
        identifier: raw_gz_ship
        description: Shipping information per order / includes orders_id, shipping_fee, logcost, ship_cost
        columns:
        - name : orders_id
          description : Key to test
          tests :
           - unique
           - not_null
        - name : shipping_fee
        - name : logcost
        - name : ship_cost